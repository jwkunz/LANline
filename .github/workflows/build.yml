name: build

# Cross-platform build of the server (workspace: server/ + hypervisor/). The
# web client is embedded into the binary at compile time (build.rs stages
# web/dist → include_str!), so a single server executable *is* server + client.
# `lanline-hypervisor` (runs one server per radio) ships from the `soapy` leg's
# artifacts. The `android` job builds the WebView-wrapper APK (same embedded
# bundle) and it rides along in the release.
#
# Two tiers:
#   standalone — `--no-default-features`: no SoapySDR, no system SDR libs. One
#                self-contained file per OS (Windows links the CRT statically).
#                Full REST API + web UI + WebRTC + discovery; live SDR is
#                stubbed (runs `--debug-tone`). These are the release assets.
#   soapy      — default features, dynamically linking libSoapySDR + its
#                runtime-loaded driver modules. Cannot be a single file by
#                SoapySDR's design — it needs radioconda/PothosSDR present on
#                the target. Linux/macOS must pass; Windows is continue-on-error
#                (pulls PothosSDR) so a run always reports where it stands.
#
# opus (audiopus_sys): Linux/macOS use system libopus via pkg-config; the
# Windows MSVC target links audiopus_sys' own bundled prebuilt opus, so nothing
# to install there. ring (webrtc crypto) needs NASM on Windows on both tiers.
#
# On a `v*` tag push, the standalone binaries + the APK are attached to a
# draft GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # PothosSDR installer for the Windows soapy leg (that job is
  # continue-on-error). If this 404s, pick a real filename from
  # https://downloads.myriadrf.org/builds/PothosSDR/
  POTHOS_URL: https://downloads.myriadrf.org/builds/PothosSDR/PothosSDR-2021.07.25-vc16-x64.exe

jobs:
  web-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  standalone:
    needs: web-bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            bin: lanline-server
            asset: lanline-server-linux-x86_64.tar.gz
            # bundle non-system .so's beside the binary; the loader resolves
            # them via $ORIGIN (audiopus_sys won't static-link libopus.a from
            # apt — it lives in a system dir the pkg-config crate keeps dynamic)
            rustflags: '-C link-arg=-Wl,-rpath,$ORIGIN'
          - os: macos-latest
            name: macos-arm64
            bin: lanline-server
            asset: lanline-server-macos-arm64.tar.gz
            rustflags: ''
          - os: windows-latest
            name: windows-x86_64
            bin: lanline-server.exe
            asset: lanline-server-windows-x86_64.zip
            rustflags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: standalone-${{ matrix.name }}

      - name: opus (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus-dev pkg-config
      - name: opus (macOS)
        if: runner.os == 'macOS'
        run: brew install opus pkg-config
      - name: NASM for ring (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      # opus:
      #   macOS  — audiopus_sys links it statically on this target already.
      #   Windows — the MSVC path links audiopus_sys' bundled prebuilt opus.
      #   Linux  — stays a dynamic libopus.so.0; it's bundled into the tar
      #            beside the binary (Package step) and found via the $ORIGIN
      #            rpath set through matrix.rustflags.
      # No `+crt-static` on Windows: that bundled opus.lib embeds
      # /DEFAULTLIB:MSVCRT (dynamic CRT) and would conflict; the zip carries
      # the redistributable VC runtime DLLs instead (below).
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --no-default-features -p lanline-server

      - run: cargo test --release --locked --no-default-features -p lanline-server

      - name: Package (Linux — binary + bundled non-system libs)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p pkg
          cp "target/release/${{ matrix.bin }}" pkg/
          ldd "target/release/${{ matrix.bin }}" | awk '/=> \//{print $3}' | while read -r so; do
            case "$so" in
              */libc.so.*|*/libm.so.*|*/libgcc_s.so.*|*/libpthread.so.*|*/libdl.so.*|*/librt.so.*) ;;
              *) echo "bundling $so"; cp -L "$so" pkg/ ;;
            esac
          done
          echo "--- resolves against the bundle + base only: ---"
          ( cd pkg && LD_LIBRARY_PATH="$PWD" ldd "./${{ matrix.bin }}" )
          if ( cd pkg && LD_LIBRARY_PATH="$PWD" ldd "./${{ matrix.bin }}" ) | grep -q "not found"; then
            echo "::error::unresolved dependency in the packaged bundle"; exit 1
          fi
          tar -C pkg -czf "${{ matrix.asset }}" .

      - name: Package (macOS — verify self-contained, then tar)
        if: runner.os == 'macOS'
        run: |
          echo "otool -L:"; otool -L "target/release/${{ matrix.bin }}"
          bad=$(otool -L "target/release/${{ matrix.bin }}" | tail -n +2 \
            | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/)' || true)
          if [ -n "$bad" ]; then
            echo "::error::binary has unexpected dylib deps:"; echo "$bad"; exit 1
          fi
          tar -C target/release -czf "${{ matrix.asset }}" "${{ matrix.bin }}"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "pkg"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/${{ matrix.bin }}" $stage
          # Redistributable VC runtime — so "unzip and run" works on a bare
          # Windows install, not just one that's had other software on it.
          # The exe's own directory is searched first for these.
          foreach ($dll in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" $stage -ErrorAction SilentlyContinue
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  soapy:
    needs: web-bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux,   bin: target/release/lanline-server,     hyp: target/release/lanline-hypervisor,     soft: false }
          - { os: macos-latest,   name: macos,   bin: target/release/lanline-server,     hyp: target/release/lanline-hypervisor,     soft: false }
          - { os: windows-latest, name: windows, bin: target/release/lanline-server.exe, hyp: target/release/lanline-hypervisor.exe, soft: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.soft }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: soapy-${{ matrix.name }}

      - name: SoapySDR + opus + libclang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsoapysdr-dev libopus-dev libclang-dev pkg-config

      - name: SoapySDR + opus + LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install soapysdr opus llvm pkg-config
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: NASM for ring (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: SoapySDR (PothosSDR) + pkg-config (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install --no-progress -y pkgconfiglite
          $exe = "$env:RUNNER_TEMP\PothosSDR.exe"
          Invoke-WebRequest -Uri $env:POTHOS_URL -OutFile $exe
          Start-Process -Wait -FilePath $exe -ArgumentList '/S','/D=C:\PothosSDR'
          "C:\PothosSDR\bin"                          | Out-File -FilePath $env:GITHUB_PATH -Append
          "PKG_CONFIG_PATH=C:\PothosSDR\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin"    | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: SoapySDRUtil sanity (non-fatal)
        continue-on-error: true
        run: SoapySDRUtil --info

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - run: cargo build --release --locked -p lanline-server -p lanline-hypervisor

      - name: cargo test (Linux only — lib is on the default loader path there)
        if: runner.os == 'Linux'
        run: cargo test --release --locked -p lanline-server -p lanline-hypervisor

      - uses: actions/upload-artifact@v4
        with:
          name: lanline-server-${{ matrix.name }}-soapy
          path: |
            ${{ matrix.bin }}
            ${{ matrix.hyp }}
          if-no-files-found: error

  clippy:
    # Default features (links libSoapySDR), all targets, warnings are errors.
    # No `cargo fmt --check`: the tree predates any rustfmt policy and a
    # default-config reformat would touch nearly every file.
    needs: web-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsoapysdr-dev libopus-dev libclang-dev pkg-config
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  voice:
    # Keep the optional `voice-text` feature (TTS + candle Whisper STT)
    # compiling. `check`, not a release artifact.
    needs: web-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: voice
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsoapysdr-dev libopus-dev libclang-dev pkg-config espeak-ng libespeak-ng-dev
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: "cargo clippy --locked --features voice-text -p lanline-server --all-targets -- -D warnings"
      - run: "cargo test --locked --features voice-text -p lanline-server voice::"

  android:
    # The APK embeds the same built web bundle as the server. Debug build:
    # it's self-signed with the debug keystore so it installs for sideloading
    # (the project has no release signing config).
    needs: web-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build APK
        working-directory: client/android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Stage APK
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' client/android/app/build.gradle.kts)
          mkdir -p apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk "apk/lanline-android-${v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apk/lanline-android-*.apk
          if-no-files-found: error

  release:
    # `v*` tag → draft Release with the standalone binaries + the APK attached.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [standalone, android, clippy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
          body: |
            ## Standalone server builds

            One self-contained executable per platform — the web client is
            embedded, so running it and opening `http://<host>:8730/` is the
            whole thing. No install, no runtime dependencies (the Windows build
            links the CRT statically).

            **These builds do not drive a real SDR.** They run everything
            except live radio hardware (start with `--debug-tone` for an
            end-to-end audio test). For a real HackRF/RTL-SDR you need the
            SoapySDR build — see `docs/windows-port.md` and the `-soapy`
            workflow artifacts — which by SoapySDR's design cannot be a single
            file (it loads driver modules at runtime).

            ## Android

            `lanline-android-<version>.apk` — the WebView wrapper (same embedded
            web client, plus the native LAN beacon listener + fleet radio
            chooser). Debug-signed for sideloading; enable "install unknown
            apps" for your browser/file manager to install it.
