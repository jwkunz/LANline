# Workspace root for the LANline project.
#
# Members:
#   server/  -- the Rust LANline server (this is the only Rust crate)
#
# The web client lives in web/ (npm/Vite) -- the server embeds its built bundle
# and serves it at `/`. The Android client is in client/android (Gradle).
# Neither is part of this Cargo workspace.
[workspace]
resolver = "2"
members = ["server"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.75"
repository = "local"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
soapysdr = "0.4"
if-addrs = "0.13"
rand = "0.8"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde-well-known"] }
# 0.13 is the last release of the classic webrtc-rs API (pre-0.20 Sans-I/O
# rewrite); it has UDPMux so every peer shares the advertised audio_out port.
webrtc = "0.13"
audiopus = "0.2"
bytes = "1"
num-complex = "0.4"
# Pure-Rust multicast-DNS responder: advertises `<name>.local` + an
# `_lanline._tcp` service so a plain browser can reach the server by name.
mdns-sd = "0.11"
