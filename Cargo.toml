# Workspace root for the LANline project.
#
# Members:
#   server/      -- the LANline server: one SDR, one DSP pipeline. Also a
#                   library (`lanline_server`) the hypervisor builds on.
#   hypervisor/  -- launcher that runs one `server` process per radio and
#                   aggregates their discovery (see docs/hypervisor.md).
#
# The web client lives in web/ (npm/Vite) -- the server embeds its built bundle
# and serves it at `/`. The Android client is in client/android (Gradle).
# Neither is part of this Cargo workspace.
[workspace]
resolver = "2"
members = ["server", "hypervisor"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.75"
authors = ["Jake Kunzler"]
repository = "https://github.com/jwkunz/LANline"
homepage = "https://github.com/jwkunz/LANline"
description = "LAN-native SDR command & control — receive (and, opt-in, transmit) from a browser or Android app"

# Release binaries are shipped as standalone downloads (the web client is
# embedded at build time, so one file is the whole server). Strip symbols to
# keep that download small.
[profile.release]
strip = true

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
soapysdr = "0.4"
if-addrs = "0.13"
toml = "0.8"
libc = "0.2"
rand = "0.8"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde-well-known"] }
# 0.13 is the last release of the classic webrtc-rs API (pre-0.20 Sans-I/O
# rewrite); it has UDPMux so every peer shares the advertised audio_out port.
webrtc = "0.13"
audiopus = "0.2"
bytes = "1"
num-complex = "0.4"
# Pure-Rust multicast-DNS responder: advertises `<name>.local` + an
# `_lanline._tcp` service so a plain browser can reach the server by name.
mdns-sd = "0.11"
# FFT for the receiver-analysis waterfall (pure Rust, no system deps).
rustfft = "6"
# stream IQ recordings off disk without buffering them (they can be ~0.5 GB).
tokio-util = { version = "0.7", features = ["io"] }
# TLS for the C2 port (--tls). `-no-provider` + an explicit rustls/ring
# provider keeps aws-lc-rs (and its cmake/NASM build) out of the tree — ring
# is already here via webrtc.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
sha2 = "0.10"
# Outbound HTTPS for ADS-B flight lookup (adsbdb.com). rustls+ring, no
# OpenSSL and no aws-lc-rs — `rustls-tls` resolves to the ring-backed
# `rustls-tls-webpki-roots` in reqwest 0.12, matching the stack already here.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
