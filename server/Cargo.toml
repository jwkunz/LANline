[package]
name = "lanline-server"
version = "2.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "lanline-server"

[lib]
name = "lanline_server"
path = "src/lib.rs"

[[bin]]
name = "lanline-server"
path = "src/main.rs"

[features]
default = ["soapy"]
# `soapy` links libSoapySDR (via radioconda). Build with
# `--no-default-features` on a box without it: device enumeration is stubbed
# and only `debug_tone` works.
soapy = ["dep:soapysdr"]

[dependencies]
webrtc.workspace = true
audiopus.workspace = true
bytes.workspace = true
num-complex.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
if-addrs.workspace = true
rand.workspace = true
time.workspace = true
mdns-sd.workspace = true
rustfft.workspace = true
tokio-util.workspace = true
axum-server.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rcgen.workspace = true
sha2.workspace = true
soapysdr = { workspace = true, optional = true }
