[package]
name = "lanline-server"
version = "2.3.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "lanline-server"

[lib]
name = "lanline_server"
path = "src/lib.rs"

[[bin]]
name = "lanline-server"
path = "src/main.rs"

[features]
default = ["soapy"]
# `soapy` links libSoapySDR (via radioconda). Build with
# `--no-default-features` on a box without it: device enumeration is stubbed
# and only `debug_tone` works.
soapy = ["dep:soapysdr"]
# `tts` — text-to-speech for the voice modes (`POST /radio/tx/say`). No Rust
# deps: it shells out to `espeak-ng` (default) or `piper` (`--tts-voice`), so
# one of those must be on PATH at runtime.
tts = []
# `stt` — speech-to-text on received transmissions (`GET /radio/transcript`).
# Pure-Rust Whisper via candle; needs a local model dir (`--stt-model`).
stt = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
voice-text = ["tts", "stt"]

[dependencies]
webrtc.workspace = true
audiopus.workspace = true
bytes.workspace = true
num-complex.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
if-addrs.workspace = true
rand.workspace = true
time.workspace = true
mdns-sd.workspace = true
rustfft.workspace = true
tokio-util.workspace = true
axum-server.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rcgen.workspace = true
sha2.workspace = true
reqwest.workspace = true
soapysdr = { workspace = true, optional = true }

# --- stt (candle Whisper), all optional ---------------------------------
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"], optional = true }
